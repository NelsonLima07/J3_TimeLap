quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:timelap}
quarkus.datasource.password=${POSTGRES_PASSWORD:timelap}

# Producao: defina POSTGRES_URL (ex.: jdbc:postgresql://localhost:5432/j3timelap)
%prod.quarkus.datasource.jdbc.url=${POSTGRES_URL}

quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.log.sql=true

quarkus.flyway.migrate-at-start=true

quarkus.http.port=8080

# CORS para o frontend Angular
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location,Content-Type
quarkus.swagger-ui.always-include=true

# Desenvolvimento local sem Docker (H2 em modo PostgreSQL)
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:j3timelap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%dev.quarkus.flyway.migrate-at-start=true

# Testes de integracao sem Docker (H2 em modo PostgreSQL)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:j3timelap;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=true